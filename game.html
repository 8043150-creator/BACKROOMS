<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE BACKROOMS — LEVEL 0</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050504;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#stats {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 13px;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px black;
}

.bar {
    width: 180px;
    height: 9px;
    background: #111;
    border: 1px solid #555;
    margin: 5px 0 12px;
}

.fill {
    width: 100%;
    height: 100%;
    background: #ddd;
}

#health {
    background: #c7c7c7;
}

#stamina {
    background: #999;
}

#status {
    color: #888;
    font-size: 11px;
}

#objective {
    position: absolute;
    right: 20px;
    top: 20px;
    text-align: right;
    font-size: 14px;
    line-height: 1.5;
    text-shadow: 0 2px 6px black;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin-left: -2px;
    margin-top: -2px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px white;
}

#message {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    text-shadow: 0 2px 10px black;
    opacity: 0;
    transition: opacity .2s;
}

#vignette {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,.8) 100%
        );
    opacity: .65;
}

#noise {
    position: absolute;
    inset: 0;
    opacity: .045;
    background-image:
        repeating-radial-gradient(
            circle at 30% 40%,
            white 0,
            white 1px,
            transparent 1px,
            transparent 4px
        );
}

#death,
#win {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.95);
    z-index: 50;
    text-align: center;
}

.big {
    font-size: clamp(45px, 10vw, 110px);
    letter-spacing: 12px;
}

.red {
    color: #a32222;
}

.screenText {
    color: #888;
    margin: 25px;
}

.screenButton {
    padding: 15px 30px;
    background: #211f17;
    border: 1px solid #77704c;
    color: white;
    cursor: pointer;
}

.screenButton:hover {
    background: #3b3725;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="stats">

        HEALTH

        <div class="bar">
            <div id="health" class="fill"></div>
        </div>

        STAMINA

        <div class="bar">
            <div id="stamina" class="fill"></div>
        </div>

        <div id="status">
            ALONE
        </div>

    </div>

    <div id="objective">
        FIND 3 EXIT SIGNS
        <br>
        <span style="color:#777">
            Then locate the elevator.
        </span>
    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="vignette"></div>

    <div id="noise"></div>

</div>


<div id="death">

    <div>

        <div class="big red">
            FOUND YOU
        </div>

        <div class="screenText">
            You should not have stayed.
        </div>

        <button
            class="screenButton"
            onclick="location.reload()"
        >
            TRY AGAIN
        </button>

    </div>

</div>


<div id="win">

    <div>

        <div class="big">
            ESCAPED
        </div>

        <div class="screenText">
            You escaped Level 0.
        </div>

        <button
            class="screenButton"
            onclick="location.href='index.html'"
        >
            MAIN MENU
        </button>

    </div>

</div>


<script>

"use strict";


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;


function resize() {

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   GAME SETTINGS
========================= */

const TILE = 160;

const MAP_WIDTH = 35;
const MAP_HEIGHT = 35;

const FOV =
    Math.PI / 3;

const RAYS = 360;


/* =========================
   GAME STATE
========================= */

let map = [];

let exits = [];

let elevator = null;

let monster = null;

let gameStarted = false;

let dead = false;

let won = false;

let paused = false;

let time = 0;

let lastTime =
    performance.now();

let screenShake = 0;

let damageFlash = 0;

let bob = 0;


/* =========================
   PLAYER
========================= */

const player = {

    x: 2.5 * TILE,

    y: 2.5 * TILE,

    angle: 0,

    health: 100,

    stamina: 100

};


/* =========================
   INPUT
========================= */

const keys = {};

window.addEventListener(
    "keydown",
    function(e) {

        keys[e.code] = true;

        if (
            e.code === "KeyE" &&
            !e.repeat &&
            gameStarted &&
            !dead &&
            !won
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e) {

        keys[e.code] = false;

    }
);


/* =========================
   MAP GENERATION
========================= */

function generateMap() {

    map =
        Array.from(
            {
                length: MAP_HEIGHT
            },
            () =>
                Array(
                    MAP_WIDTH
                ).fill(1)
        );


    /*
       Maze generation
    */

    const queue = [
        [1, 1]
    ];

    map[1][1] = 0;


    while (queue.length > 0) {

        const current =
            queue.shift();

        const x =
            current[0];

        const y =
            current[1];


        const directions = [

            [2, 0],

            [-2, 0],

            [0, 2],

            [0, -2]

        ];


        directions.sort(
            () =>
                Math.random() - .5
        );


        for (
            const direction
            of directions
        ) {

            const nx =
                x + direction[0];

            const ny =
                y + direction[1];


            if (
                nx > 1 &&
                ny > 1 &&
                nx < MAP_WIDTH - 2 &&
                ny < MAP_HEIGHT - 2 &&
                map[ny][nx] === 1
            ) {

                map[
                    y + direction[1] / 2
                ][
                    x + direction[0] / 2
                ] = 0;


                map[ny][nx] = 0;


                queue.push([
                    nx,
                    ny
                ]);

            }

        }

    }


    /*
       Open random rooms
    */

    for (
        let i = 0;
        i < 65;
        i++
    ) {

        const x =
            2 +
            Math.floor(
                Math.random() *
                (MAP_WIDTH - 4)
            );

        const y =
            2 +
            Math.floor(
                Math.random() *
                (MAP_HEIGHT - 4)
            );


        if (
            map[y] &&
            map[y][x] === 0
        ) {

            for (
                let yy = -1;
                yy <= 1;
                yy++
            ) {

                for (
                    let xx = -1;
                    xx <= 1;
                    xx++
                ) {

                    if (
                        map[y + yy] &&
                        map[y + yy][x + xx] !== undefined
                    ) {

                        if (
                            Math.random() < .75
                        ) {

                            map[y + yy][x + xx] = 0;

                        }

                    }

                }

            }

        }

    }


    /*
       Starting area
    */

    map[1][1] = 0;
    map[1][2] = 0;
    map[2][1] = 0;
    map[2][2] = 0;


    /*
       Exit signs
    */

    exits = [];


    let attempts = 0;


    while (
        exits.length < 3 &&
        attempts < 1000
    ) {

        attempts++;


        const gx =
            2 +
            Math.floor(
                Math.random() *
                (MAP_WIDTH - 4)
            );


        const gy =
            2 +
            Math.floor(
                Math.random() *
                (MAP_HEIGHT - 4)
            );


        if (
            map[gy][gx] === 0 &&
            Math.hypot(
                gx - 1,
                gy - 1
            ) > 10
        ) {

            const already =
                exits.some(
                    e =>
                        e.gx === gx &&
                        e.gy === gy
                );


            if (!already) {

                exits.push({

                    gx: gx,

                    gy: gy,

                    x:
                        gx * TILE +
                        TILE / 2,

                    y:
                        gy * TILE +
                        TILE / 2,

                    found: false

                });

            }

        }

    }


    /*
       Elevator
    */

    const elevatorSpot =
        exits[
            exits.length - 1
        ];


    elevator = {

        x: elevatorSpot.x,

        y: elevatorSpot.y

    };


    /*
       Monster
    */

    monster = {

        x: 25 * TILE,

        y: 25 * TILE,

        speed: 75,

        active: false

    };

}


generateMap();


/* =========================
   COLLISION
========================= */

function isWall(x, y) {

    const gx =
        Math.floor(
            x / TILE
        );

    const gy =
        Math.floor(
            y / TILE
        );


    if (
        gx < 0 ||
        gy < 0 ||
        gx >= MAP_WIDTH ||
        gy >= MAP_HEIGHT
    ) {

        return true;

    }


    return map[gy][gx] === 1;

}


function blocked(
    x,
    y,
    radius = 18
) {

    const points = [

        [x - radius, y - radius],

        [x + radius, y - radius],

        [x - radius, y + radius],

        [x + radius, y + radius]

    ];


    for (
        const point of points
    ) {

        if (
            isWall(
                point[0],
                point[1]
            )
        ) {

            return true;

        }

    }


    return false;

}


function moveEntity(
    entity,
    dx,
    dy,
    radius = 18
) {

    if (
        !blocked(
            entity.x + dx,
            entity.y,
            radius
        )
    ) {

        entity.x += dx;

    }


    if (
        !blocked(
            entity.x,
            entity.y + dy,
            radius
        )
    ) {

        entity.y += dy;

    }

}


/* =========================
   DISTANCE
========================= */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* =========================
   RAYCASTING
========================= */

function castRay(angle) {

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);


    let distance = 0;


    while (
        distance < 3000
    ) {

        const x =
            player.x +
            cos * distance;

        const y =
            player.y +
            sin * distance;


        if (
            isWall(x, y)
        ) {

            return {

                distance,
                x,
                y

            };

        }


        distance += 4;

    }


    return {

        distance: 3000,

        x:
            player.x +
            cos * 3000,

        y:
            player.y +
            sin * 3000

    };

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld() {

    /*
       Ceiling
    */

    ctx.fillStyle =
        "#111009";

    ctx.fillRect(
        0,
        0,
        W,
        H / 2
    );


    /*
       Floor
    */

    ctx.fillStyle =
        "#292519";

    ctx.fillRect(
        0,
        H / 2,
        W,
        H / 2
    );


    const horizon =
        H * .49;


    for (
        let ray = 0;
        ray < RAYS;
        ray++
    ) {

        const angle =
            player.angle -
            FOV / 2 +
            FOV *
            ray /
            (RAYS - 1);


        const hit =
            castRay(angle);


        const corrected =
            hit.distance *
            Math.cos(
                angle -
                player.angle
            );


        const wallHeight =
            Math.min(
                H * 3,
                TILE *
                H /
                Math.max(
                    corrected,
                    1
                )
            );


        const top =
            horizon -
            wallHeight / 2;


        let brightness =
            145 -
            corrected * .075;


        brightness =
            Math.max(
                22,
                brightness
            );


        const red =
            Math.floor(
                brightness + 25
            );

        const green =
            Math.floor(
                brightness + 22
            );

        const blue =
            Math.floor(
                brightness - 7
            );


        ctx.fillStyle =
            `rgb(${red},${green},${blue})`;


        const x =
            ray *
            W /
            RAYS;


        ctx.fillRect(
            x,
            top,
            W / RAYS + 1,
            wallHeight
        );


        /*
           Wall seams
        */

        if (
            ray % 42 === 0 &&
            corrected < 1000
        ) {

            ctx.fillStyle =
                "rgba(30,25,10,.35)";

            ctx.fillRect(
                x,
                top,
                2,
                wallHeight
            );

        }

    }

}


/* =========================
   DRAW OBJECTS
========================= */

function drawObjects() {

    const objects = [];


    /*
       Exit signs
    */

    exits.forEach(
        function(exit, index) {

            if (
                !exit.found
            ) {

                objects.push({

                    x: exit.x,

                    y: exit.y,

                    type: "exit",

                    index

                });

            }

        }
    );


    /*
       Elevator
    */

    objects.push({

        x: elevator.x,

        y: elevator.y,

        type: "elevator"

    });


    /*
       Monster
    */

    if (
        monster.active
    ) {

        objects.push({

            x: monster.x,

            y: monster.y,

            type: "monster"

        });

    }


    /*
       Furthest first
    */

    objects.sort(
        function(a, b) {

            return (
                distance(b, player) -
                distance(a, player)
            );

        }
    );


    for (
        const object
        of objects
    ) {

        const dx =
            object.x -
            player.x;

        const dy =
            object.y -
            player.y;


        const d =
            Math.hypot(
                dx,
                dy
            );


        let angle =
            Math.atan2(
                dy,
                dx
            ) -
            player.angle;


        while (
            angle > Math.PI
        ) {

            angle -=
                Math.PI * 2;

        }


        while (
            angle < -Math.PI
        ) {

            angle +=
                Math.PI * 2;

        }


        if (
            Math.abs(angle) >
            FOV * .7
        ) {

            continue;

        }


        const screenX =
            W / 2 +
            Math.tan(angle) /
            Math.tan(FOV / 2) *
            W / 2;


        const size =
            Math.min(
                H * 1.2,
                TILE *
                H /
                Math.max(
                    d,
                    1
                )
            );


        if (
            object.type === "exit"
        ) {

            /*
               Red EXIT sign
            */

            ctx.fillStyle =
                "#9e1919";

            ctx.fillRect(
                screenX -
                size * .38,

                H * .49 -
                size * .45,

                size * .76,

                size * .5
            );


            ctx.fillStyle =
                "#eee";

            ctx.font =
                `bold ${Math.max(
                    10,
                    size * .18
                )}px Arial`;

            ctx.textAlign =
                "center";


            ctx.fillText(
                "EXIT",

                screenX,

                H * .49 -
                size * .13
            );

        }


        else if (
            object.type === "elevator"
        ) {

            /*
               Elevator
            */

            ctx.fillStyle =
                "#66645b";

            ctx.fillRect(
                screenX -
                size * .38,

                H * .49 -
                size * .55,

                size * .76,

                size * 1.1
            );


            ctx.fillStyle =
                "#161616";

            ctx.fillRect(
                screenX -
                size * .28,

                H * .49 -
                size * .43,

                size * .56,

                size * .8
            );


            ctx.fillStyle =
                "#cbb84d";

            ctx.fillRect(
                screenX -
                size * .06,

                H * .49 -
                size * .47,

                size * .12,

                size * .07
            );

        }


        else if (
            object.type === "monster"
        ) {

            /*
               Monster body
            */

            ctx.fillStyle =
                "#030303";


            ctx.beginPath();

            ctx.ellipse(
                screenX,

                H * .49 -
                size * .05,

                size * .22,

                size * .46,

                0,

                0,

                Math.PI * 2
            );

            ctx.fill();


            /*
               Head
            */

            ctx.beginPath();

            ctx.arc(
                screenX,

                H * .49 -
                size * .52,

                size * .18,

                0,

                Math.PI * 2
            );

            ctx.fill();


            /*
               Eyes
            */

            ctx.fillStyle =
                "#eee";


            ctx.fillRect(
                screenX -
                size * .1,

                H * .49 -
                size * .57,

                size * .05,

                size * .035
            );


            ctx.fillRect(
                screenX +
                size * .05,

                H * .49 -
                size * .57,

                size * .05,

                size * .035
            );

        }

    }

}


/* =========================
   MESSAGE
========================= */

let messageTimer = null;


function message(
    text,
    duration = 1800
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.style.opacity =
        "1";


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function() {

                element.style.opacity =
                    "0";

            },

            duration
        );

}


/* =========================
   OBJECTIVE
========================= */

function updateObjective() {

    const found =
        exits.filter(
            e => e.found
        ).length;


    const remaining =
        3 - found;


    const element =
        document.getElementById(
            "objective"
        );


    if (
        remaining > 0
    ) {

        element.innerHTML =
            `FIND ${remaining} MORE EXIT SIGN${remaining === 1 ? "" : "S"}<br>
            <span style="color:#777">
            The footsteps are getting closer.
            </span>`;

    }

    else {

        element.innerHTML =
            `FIND THE ELEVATOR<br>
            <span style="color:#777">
            Press E when you reach it.
            </span>`;

    }

}


/* =========================
   INTERACTION
========================= */

function interact() {

    /*
       Exit signs
    */

    for (
        const exit of exits
    ) {

        if (
            !exit.found &&
            distance(
                player,
                exit
            ) < 110
        ) {

            exit.found =
                true;


            message(
                "YOU FOUND AN EXIT SIGN."
            );


            monster.active =
                true;


            monster.speed +=
                8;


            updateObjective();


            return;

        }

    }


    /*
       Elevator
    */

    if (
        distance(
            player,
            elevator
        ) < 130
    ) {

        const allFound =
            exits.every(
                e => e.found
            );


        if (
            allFound
        ) {

            won =
                true;


            document.getElementById(
                "win"
            ).style.display =
                "flex";


            if (
                document.exitPointerLock
            ) {

                document.exitPointerLock();

            }

        }

        else {

            const remaining =
                exits.filter(
                    e => !e.found
                ).length;


            message(
                `THE ELEVATOR IS LOCKED — ${remaining} SIGN${remaining === 1 ? "" : "S"} REMAIN.`
            );

        }

    }

}


/* =========================
   DAMAGE
========================= */

function damage(amount) {

    player.health =
        Math.max(
            0,
            player.health -
            amount
        );


    damageFlash =
        1;


    screenShake =
        10;


    if (
        player.health <= 0
    ) {

        dead =
            true;


        document.getElementById(
            "death"
        ).style.display =
            "flex";


        if (
            document.exitPointerLock
        ) {

            document.exitPointerLock();

        }

    }

}


/* =========================
   UPDATE
========================= */

function update(dt) {

    time += dt;


    let forward = 0;

    let strafe = 0;


    if (
        keys.KeyW
    ) {

        forward += 1;

    }


    if (
        keys.KeyS
    ) {

        forward -= 1;

    }


    if (
        keys.KeyD
    ) {

        strafe += 1;

    }


    if (
        keys.KeyA
    ) {

        strafe -= 1;

    }


    const movement =
        Math.hypot(
            forward,
            strafe
        );


    if (
        movement > 0
    ) {

        forward /=
            movement;

        strafe /=
            movement;

    }


    const running =
        keys.ShiftLeft ||
        keys.ShiftRight;


    let speed = 115;


    if (
        running &&
        player.stamina > 0 &&
        movement > 0
    ) {

        speed =
            195;


        player.stamina =
            Math.max(
                0,
                player.stamina -
                dt * 28
            );

    }

    else {

        player.stamina =
            Math.min(
                100,
                player.stamina +
                dt * 18
            );

    }


    const dx =
        (
            Math.cos(
                player.angle
            ) *
            forward -

            Math.sin(
                player.angle
            ) *
            strafe
        ) *
        speed *
        dt;


    const dy =
        (
            Math.sin(
                player.angle
            ) *
            forward +

            Math.cos(
                player.angle
            ) *
            strafe
        ) *
        speed *
        dt;


    moveEntity(
        player,
        dx,
        dy
    );


    /*
       Footstep bob
    */

    if (
        movement > 0
    ) {

        bob +=
            dt *
            (
                running
                ? 13
                : 7
            );

    }


    /*
       Monster
    */

    if (
        monster.active &&
        !dead
    ) {

        const d =
            distance(
                player,
                monster
            );


        if (
            d > 75
        ) {

            const angle =
                Math.atan2(
                    player.y -
                    monster.y,

                    player.x -
                    monster.x
                );


            let monsterSpeed =
                monster.speed;


            if (
                d > 650
            ) {

                monsterSpeed *=
                    .5;

            }


            moveEntity(
                monster,

                Math.cos(angle) *
                monsterSpeed *
                dt,

                Math.sin(angle) *
                monsterSpeed *
                dt,

                20
            );

        }

        else {

            damage(
                dt * 14
            );

        }


        const status =
            document.getElementById(
                "status"
            );


        if (
            d < 450
        ) {

            status.textContent =
                "SOMETHING IS NEAR";

        }

        else {

            status.textContent =
                "YOU ARE NOT ALONE";

        }

    }


    /*
       Random creepy messages
    */

    if (
        monster.active &&
        Math.random() <
        dt * .13
    ) {

        if (
            distance(
                player,
                monster
            ) < 850
        ) {

            message(
                "...",
                700
            );

        }

    }


    /*
       HUD
    */

    document.getElementById(
        "health"
    ).style.width =
        player.health + "%";


    document.getElementById(
        "stamina"
    ).style.width =
        player.stamina + "%";


    damageFlash =
        Math.max(
            0,
            damageFlash -
            dt * 4
        );


    screenShake =
        Math.max(
            0,
            screenShake -
            dt * 20
        );

}


/* =========================
   RENDER
========================= */

function render() {

    ctx.save();


    /*
       Screen shake
    */

    if (
        screenShake > 0
    ) {

        ctx.translate(

            (
                Math.random() -
                .5
            ) *
            screenShake,

            (
                Math.random() -
                .5
            ) *
            screenShake

        );

    }


    drawWorld();

    drawObjects();


    /*
       Darkness
    */

    const flashlight =
        ctx.createRadialGradient(

            W / 2,

            H * .5,

            50,

            W / 2,

            H * .5,

            Math.min(W, H) * .7

        );


    flashlight.addColorStop(
        0,
        "rgba(255,255,220,.03)"
    );


    flashlight.addColorStop(
        .5,
        "rgba(0,0,0,.15)"
    );


    flashlight.addColorStop(
        1,
        "rgba(0,0,0,.72)"
    );


    ctx.fillStyle =
        flashlight;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Extra vignette
    */

    const vignette =
        ctx.createRadialGradient(

            W / 2,
            H / 2,
            Math.min(W,H) * .15,

            W / 2,
            H / 2,
            Math.max(W,H) * .75

        );


    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    vignette.addColorStop(
        1,
        "rgba(0,0,0,.8)"
    );


    ctx.fillStyle =
        vignette;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Damage flash
    */

    if (
        damageFlash > 0
    ) {

        ctx.fillStyle =
            `rgba(180,0,0,${damageFlash * .2})`;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    ctx.restore();

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(now) {

    const dt =
        Math.min(
            .05,
            (now - lastTime) /
            1000
        );


    lastTime =
        now;


    if (
        gameStarted &&
        !paused &&
        !dead &&
        !won
    ) {

        update(dt);

    }


    if (
        gameStarted
    ) {

        render();

    }


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =========================
   START GAME
========================= */

function startGame() {

    gameStarted =
        true;


    message(
        "FIND THE EXIT SIGNS.",
        2500
    );


    canvas.requestPointerLock?.();


    /*
       Put monster somewhere away
       from starting position.
    */

    monster.x =
        exits[0].x +
        TILE * 4;


    monster.y =
        exits[0].y +
        TILE * 3;

}


/* =========================
   MOUSE LOOK
========================= */

canvas.addEventListener(
    "click",
    function() {

        if (
            !dead &&
            !won
        ) {

            canvas.requestPointerLock?.();

            paused =
                false;

        }

    }
);


document.addEventListener(
    "mousemove",
    function(e) {

        if (
            document.pointerLockElement ===
            canvas &&
            !dead &&
            !won
        ) {

            player.angle +=
                e.movementX *
                .0025;

        }

    }
);


/* =========================
   POINTER LOCK
========================= */

document.addEventListener(
    "pointerlockchange",
    function() {

        if (
            gameStarted &&
            !dead &&
            !won
        ) {

            paused =
                document.pointerLockElement !==
                canvas;

        }

    }
);


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "Escape"
        ) {

            paused =
                true;

        }

    }
);


/* =========================
   INITIAL OBJECTIVE
========================= */

updateObjective();


/* =========================
   START AUTOMATICALLY
========================= */

startGame();

</script>
