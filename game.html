<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   BACKROOMS
   ============================================================ */

let scene;
let camera;
let renderer;

let player;
let monster;

let flashlight;

let clock = new THREE.Clock();

let started = false;
let dead = false;
let won = false;

let level = 0;

let health = 100;
let stamina = 100;

let yaw = 0;
let pitch = 0;

let keys = {};

let walls = [];
let lights = [];

let exitDoor;

let keyItem;

let hasKey = false;

let audio;


/* ============================================================
   INIT
   ============================================================ */

function init(){

    /* SCENE */

    scene = new THREE.Scene();

/* ============================================================
   MATERIALS
   ============================================================ */

const wallpaper =
    new THREE.MeshStandardMaterial({
        color:0xc9bd69,
        roughness:1
    });

const carpet =
    new THREE.MeshStandardMaterial({
        color:0x766b40,
        roughness:1
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        color:0xe2dfc8,
        roughness:1
    });

const darkWall =
    new THREE.MeshStandardMaterial({
        color:0x756b39,
        roughness:1
    });


/* ============================================================
   BUILD BACKROOMS
   ============================================================ */

function buildBackrooms(){

    walls = [];
    lights = [];

    /*
       HUGE FLOOR
    */

    let floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                180,
                180
            ),
            carpet
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);


    /*
       CEILING
    */

    let ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                180,
                180
            ),
            ceilingMaterial
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y = 7;

    scene.add(ceiling);


    /*
       CREATE LONG WALL SYSTEM
    */

    createLongWall(
        -35,
        0,
        70,
        0
    );

    createLongWall(
        35,
        0,
        70,
        0
    );

    createLongWall(
        0,
        -35,
        70,
        1
    );

    createLongWall(
        0,
        35,
        70,
        1
    );


    /*
       INTERIOR CORRIDORS
    */

    createLongWall(
        -15,
        -15,
        40,
        0
    );

    createLongWall(
        15,
        15,
        40,
        0
    );

    createLongWall(
        -15,
        15,
        40,
        1
    );

    createLongWall(
        15,
        -15,
        40,
        1
    );


    createLongWall(
        0,
        0,
        30,
        1
    );


    /*
       SIDE WALLS
    */

    createLongWall(
        -5,
        -20,
        30,
        0
    );

    createLongWall(
        5,
        20,
        30,
        0
    );


    /*
       BACKROOMS LIGHTS
    */

    for(let x=-60;x<=60;x+=12){

        for(let z=-60;z<=60;z+=12){

            addCeilingLight(
                x,
                z
            );

        }

    }


    /*
       EXIT
    */

    createExit();


    /*
       KEY
    */

    createKey();


    /*
       MONSTER
    */

    createMonster();


    /*
       WALLPAPER DETAILS
    */

    createWallpaperDetails();


    /*
       CARPET DETAILS
    */

    createCarpetDetails();

}


/* ============================================================
   LONG WALL
   ============================================================ */

function createLongWall(
    x,
    z,
    length,
    direction
){

    let geometry;


    if(direction === 0){

        geometry =
            new THREE.BoxGeometry(
                length,
                7,
                .45
            );

    }else{

        geometry =
            new THREE.BoxGeometry(
                .45,
                7,
                length
            );

    }


    let wall =
        new THREE.Mesh(
            geometry,
            wallpaper
        );


    wall.position.set(
        x,
        3.5,
        z
    );

    wall.castShadow = true;
    wall.receiveShadow = true;

    scene.add(wall);

    walls.push(wall);


    /*
       Wallpaper vertical seams
    */

    if(direction===0){

        for(
            let p=-length/2;
            p<length/2;
            p+=4
        ){

            let seam =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .025,
                        6.7,
                        .015
                    ),
                    darkWall
                );

            seam.position.set(
                x+p,
                3.5,
                z-.24
            );

            scene.add(seam);

        }

    }

}


/* ============================================================
   CEILING LIGHT
   ============================================================ */

function addCeilingLight(
    x,
    z
){

    /*
       Light fixture
    */

    let fixture =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.5,
                .12,
                1.1
            ),
            new THREE.MeshBasicMaterial({
                color:0xffffff
            })
        );

    fixture.position.set(
        x,
        6.82,
        z
    );

    scene.add(fixture);


    /*
       Glow
    */

    let light =
        new THREE.PointLight(
            0xfff6d0,
            1.25,
            25
        );

    light.position.set(
        x,
        6.25,
        z
    );

    scene.add(light);

    lights.push(light);

}


/* ============================================================
   WALLPAPER DETAILS
   ============================================================ */

function createWallpaperDetails(){

    for(let i=0;i<120;i++){

        let x =
            -65 +
            Math.random()*130;

        let z =
            -65 +
            Math.random()*130;


        let mark =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    .4+
                    Math.random()*.5,
                    .15+
                    Math.random()*.3
                ),
                new THREE.MeshBasicMaterial({
                    color:0x8f843f,
                    transparent:true,
                    opacity:.12
                })
            );


        mark.position.set(
            x,
            1+
            Math.random()*4,
            z
        );

        mark.rotation.y =
            Math.random()*Math.PI;

        scene.add(mark);

    }

}


/* ============================================================
   CARPET DETAILS
   ============================================================ */

function createCarpetDetails(){

    for(let i=0;i<90;i++){

        let stain =
            new THREE.Mesh(
                new THREE.CircleGeometry(
                    .2+
                    Math.random()*.9,
                    12
                ),
                new THREE.MeshBasicMaterial({
                    color:0x4e4729,
                    transparent:true,
                    opacity:.12
                })
            );


        stain.rotation.x =
            -Math.PI/2;


        stain.position.set(
            -65+
            Math.random()*130,
            .008,
            -65+
            Math.random()*130
        );


        scene.add(stain);

    }

}


/* ============================================================
   EXIT
   ============================================================ */

function createExit(){

    exitDoor =
        new THREE.Group();


    exitDoor.position.set(
        58,
        0,
        58
    );


    let frameMaterial =
        new THREE.MeshStandardMaterial({
            color:0x252525,
            roughness:.7
        });


    let doorMaterial =
        new THREE.MeshStandardMaterial({
            color:0x181818,
            roughness:.6
        });


    let left =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .4,
                6,
                .5
            ),
            frameMaterial
        );

    left.position.x=-2;


    let right=left.clone();

    right.position.x=2;


    let top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.4,
                .4,
                .5
            ),
            frameMaterial
        );

    top.position.y=6;


    let door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.6,
                5.6,
                .2
            ),
            doorMaterial
        );

    door.position.y=2.8;


    exitDoor.add(
        left,
        right,
        top,
        door
    );


    /*
       EXIT SIGN
    */

    let sign =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                .7,
                .1
            ),
            new THREE.MeshBasicMaterial({
                color:0xffdf77
            })
        );

    sign.position.set(
        0,
        5.4,
        -.3
    );


    exitDoor.add(sign);


    scene.add(exitDoor);

}


/* ============================================================
   KEY
   ============================================================ */

function createKey(){

    keyItem =
        new THREE.Group();


    let gold =
        new THREE.MeshStandardMaterial({
            color:0xffd33d,
            metalness:.9,
            roughness:.15
        });


    let ring =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .28,
                .07,
                10,
                20
            ),
            gold
        );


    let shaft =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                .1,
                .1
            ),
            gold
        );

    shaft.position.x=.4;


    keyItem.add(
        ring,
        shaft
    );


    keyItem.position.set(
        -45,
        1.2,
        -45
    );


    scene.add(keyItem);

}


/* ============================================================
   MONSTER
   ============================================================ */

function createMonster(){

    monster =
        new THREE.Group();


    /*
       BODY
    */

    let body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                1.05,
                3.1,
                8,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x050505,
                roughness:1
            })
        );

    body.position.y=2.4;


    /*
       HEAD
    */

    let head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.25,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0x020202,
                roughness:1
            })
        );

    head.position.y=5;


    /*
       EYES
    */

    let red =
        new THREE.MeshBasicMaterial({
            color:0xff0000
        });


    let eye1 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .16,
                10,
                10
            ),
            red
        );

    eye1.position.set(
        -.43,
        5.05,
        -.98
    );


    let eye2=eye1.clone();

    eye2.position.x=.43;


    monster.add(
        body,
        head,
        eye1,
        eye2
    );


    monster.position.set(
        -50,
        0,
        -50
    );


    /*
       START INVISIBLE
    */

    monster.visible=false;

    scene.add(monster);

}


/* ============================================================
   START
   ============================================================ */

function startGame(){

    if(started)return;

    started=true;

    document.getElementById(
        "startScreen"
    ).style.display="none";


    /*
       Pointer lock
    */

    renderer.domElement.requestPointerLock();


    /*
       Audio
    */

    try{

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }catch(e){}


    /*
       Entity wakes up after 8 seconds.
    */

    setTimeout(()=>{

        if(!dead){

            monsterActive=true;
            monster.visible=true;

        }

    },8000);

}


/* ============================================================
   MOUSE
   ============================================================ */

document.addEventListener(
    "mousemove",
    function(e){

        if(
            !started ||
            dead ||
            won
        )return;


        if(
            document.pointerLockElement !==
            renderer.domElement
        )return;


        yaw -=
            e.movementX*.002;


        pitch -=
            e.movementY*.002;


        pitch =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    pitch
                )
            );


        player.rotation.y=yaw;

        camera.rotation.x=pitch;

    }
);


/* ============================================================
   KEYBOARD
   ============================================================ */

function setupControls(){

    document.addEventListener(
        "keydown",
        function(e){

            keys[e.code]=true;


            if(e.code==="KeyF"){

                flashlight.visible=
                    !flashlight.visible;

                document.getElementById(
                    "flashlight"
                ).textContent=
                    flashlight.visible
                    ?"FLASHLIGHT [F]"
                    :"FLASHLIGHT OFF [F]";

            }


            if(e.code==="KeyE"){

                interact();

            }

        }
    );


    document.addEventListener(
        "keyup",
        function(e){

            keys[e.code]=false;

        }
    );

}


/* ============================================================
   MOVEMENT
   ============================================================ */

function movePlayer(dt){

    if(
        !started ||
        dead ||
        won
    )return;


    let direction =
        new THREE.Vector3();


    if(keys.KeyW)
        direction.z-=1;

    if(keys.KeyS)
        direction.z+=1;

    if(keys.KeyA)
        direction.x-=1;

    if(keys.KeyD)
        direction.x+=1;


    if(direction.length()>0)
        direction.normalize();


    let running =
        keys.ShiftLeft ||
        keys.ShiftRight;


    let speed=4;


    if(
        running &&
        stamina>0 &&
        direction.length()>0
    ){

        speed=7.5;

        stamina-=35*dt;

    }else{

        stamina+=18*dt;

    }


    stamina=Math.max(
        0,
        Math.min(
            100,
            stamina
        )
    );


    document.getElementById(
        "stamina"
    ).style.width=
        stamina+"%";


    /*
       WORLD DIRECTIONS
    */

    let forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    let right =
        new THREE.Vector3(
            1,
            0,
            0
        );


    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );


    let move =
        new THREE.Vector3();


    move.addScaledVector(
        forward,
        -direction.z*
        speed*
        dt
    );


    move.addScaledVector(
        right,
        direction.x*
        speed*
        dt
    );


    collide(move);


    /*
       CAMERA BOB
    */

    if(direction.length()>0){

        camera.position.y =
            Math.sin(
                performance.now()*.012
            )*
            (running?.055:.03);

    }else{

        camera.position.y +=
            (0-camera.position.y)*
            .1;

    }

}


/* ============================================================
   COLLISION
   ============================================================ */

function collide(move){

    let old =
        player.position.clone();


    player.position.add(move);


    let box =
        new THREE.Box3()
        .setFromCenterAndSize(
            player.position,
            new THREE.Vector3(
                .8,
                2,
                .8
            )
        );


    for(let wall of walls){

        let wallBox =
            new THREE.Box3()
            .setFromObject(wall);


        if(
            box.intersectsBox(
                wallBox
            )
        ){

            player.position.copy(
                old
            );

            break;

        }

    }


    /*
       WORLD BOUNDS
    */

    player.position.x=
        Math.max(
            -84,
            Math.min(
                84,
                player.position.x
            )
        );


    player.position.z=
        Math.max(
            -84,
            Math.min(
                84,
                player.position.z
            )
        );

}


/* ============================================================
   ENTITY
   ============================================================ */

function updateMonster(dt){

    if(
        !monster ||
        !monsterActive ||
        dead ||
        won
    )return;


    let distance =
        monster.position.distanceTo(
            player.position
        );


    /*
       Entity only moves when player
       enters its hunting range.
    */

    if(distance<100){

        let direction =
            new THREE.Vector3()
            .subVectors(
                player.position,
                monster.position
            )
            .normalize();


        let speed=1.35;


        if(distance<35)
            speed=2.2;


        if(distance<15)
            speed=3.2;


        /*
           Sprinting makes noise.
        */

        if(
            keys.ShiftLeft ||
            keys.ShiftRight
        ){

            speed*=1.25;

        }


        monster.position.add(
            direction.multiplyScalar(
                speed*dt
            )
        );


        monster.lookAt(
            player.position.x,
            3,
            player.position.z
        );


        /*
           ENTITY ATTACK
        */

        if(distance<2.3){

            killPlayer();

        }


        /*
           RED VIGNETTE
        */

        let danger=
            Math.max(
                0,
                1-distance/30
            );


        document.getElementById(
            "vignette"
        ).style.background=
            `radial-gradient(
                circle,
                transparent 35%,
                rgba(
                    100,
                    0,
                    0,
                    ${danger*.65}
                ) 100%
            )`;

    }

}


/* ============================================================
   INTERACTION
   ============================================================ */

function interact(){

    if(
        !started ||
        dead ||
        won
    )return;


    /*
       KEY
    */

    if(
        keyItem &&
        player.position.distanceTo(
            keyItem.position
        )<3
    ){

        hasKey=true;

        scene.remove(
            keyItem
        );

        document.getElementById(
            "objective"
        ).textContent=
            "KEY FOUND — FIND THE EXIT";

        return;

    }


    /*
       EXIT
    */

    if(
        exitDoor &&
        player.position.distanceTo(
            exitDoor.position
        )<5
    ){

        if(hasKey){

            win();

        }else{

            showMessage(
                "THE DOOR IS LOCKED"
            );

        }

    }

}


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text){

    let el =
        document.getElementById(
            "interact"
        );

    el.textContent=text;

    setTimeout(()=>{
        el.textContent="";
    },1500);

}


/* ============================================================
   WIN
   ============================================================ */

function win(){

    won=true;

    if(document.exitPointerLock)
        document.exitPointerLock();


    document.getElementById(
        "winScreen"
    ).style.display="flex";

}


/* ============================================================
   NEXT LEVEL
   ============================================================ */

function nextLevel(){

    /*
       For now Level 1 resets into
       a darker version.

       More levels can be added here.
    */

    level++;

    if(level>2){

        location.href="index.html";

        return;

    }


    /*
       Change the environment.
    */

    if(level===1){

        scene.background=
            new THREE.Color(
                0x080808
            );

        scene.fog=
            new THREE.Fog(
                0x080808,
                10,
                80
            );

        document.getElementById(
            "level"
        ).textContent=
            "LEVEL 1";

        document.getElementById(
            "objective"
        ).textContent=
            "FIND THE RED EXIT";

    }


    if(level===2){

        scene.background=
            new THREE.Color(
                0x0b2528
            );

        scene.fog=
            new THREE.Fog(
                0x0b2528,
                12,
                90
            );

        document.getElementById(
            "level"
        ).textContent=
            "LEVEL 2";

        document.getElementById(
            "objective"
        ).textContent=
            "ESCAPE THE POOLROOMS";

    }


    won=false;
    hasKey=false;
    health=100;
    stamina=100;

    player.position.set(
        0,
        1.7,
        0
    );

    monster.position.set(
        -50,
        0,
        -50
    );

    monsterActive=false;
    monster.visible=false;


    document.getElementById(
        "health"
    ).style.width="100%";

    document.getElementById(
        "stamina"
    ).style.width="100%";


    document.getElementById(
        "winScreen"
    ).style.display="none";


    /*
       New key
    */

    createKey();


    setTimeout(()=>{

        monsterActive=true;
        monster.visible=true;

    },7000);

}


/* ============================================================
   DEATH
   ============================================================ */

function killPlayer(){

    if(dead)return;

    dead=true;


    if(document.exitPointerLock)
        document.exitPointerLock();


    /*
       Camera shake.
    */

    let shake=0;

    let interval=setInterval(()=>{

        shake++;

        camera.position.x=
            (Math.random()-.5)*.3;

        camera.position.y=
            (Math.random()-.5)*.3;

        if(shake>12){

            clearInterval(interval);

            camera.position.x=0;
            camera.position.y=0;

        }

    },40);


    setTimeout(()=>{

        document.getElementById(
            "deathScreen"
        ).style.display="flex";

    },500);

}


/* ============================================================
   LIGHT FLICKER
   ============================================================ */

function updateLights(){

    for(let light of lights){

        /*
           Most lights remain on.
        */

        if(
            Math.random()<.008
        ){

            light.intensity=0;

            setTimeout(()=>{

                light.intensity=1.25;

            },100+
            Math.random()*300);

        }

    }

}


/* ============================================================
   BACKROOMS AMBIENCE
   ============================================================ */

let ambientTimer=0;

function ambience(dt){

    if(!started)return;

    ambientTimer+=dt;

    if(
        ambientTimer>5
    ){

        ambientTimer=0;

        if(audio){

            let osc =
                audio.createOscillator();

            let gain =
                audio.createGain();

            osc.type="sine";

            osc.frequency.value=55;

            gain.gain.value=.015;

            osc.connect(gain);

            gain.connect(
                audio.destination
            );

            osc.start();

            gain.gain.exponentialRampToValueAtTime(
                .001,
                audio.currentTime+1
            );

            osc.stop(
                audio.currentTime+1
            );

        }

    }

}


/* ============================================================
   LOOP
   ============================================================ */

function animate(){

    requestAnimationFrame(
        animate
    );


    let dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    movePlayer(dt);

    updateMonster(dt);

    updateLights();

    ambience(dt);


    renderer.render(
        scene,
        camera
    );

}


/* ============================================================
   RESIZE
   ============================================================ */

function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* ============================================================
   START EVERYTHING
   ============================================================ */

init();

</script>
