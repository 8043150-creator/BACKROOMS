<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #080806;
    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.82)),
        repeating-linear-gradient(
            90deg,
            #262417 0px,
            #262417 100px,
            #302d1c 102px,
            #211f15 105px
        );
    filter: blur(1px);
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    background-image:
        repeating-radial-gradient(
            circle at 20% 30%,
            white 0,
            white 1px,
            transparent 1px,
            transparent 3px
        );
}

.menu {
    position: relative;
    z-index: 2;
    width: min(700px, 90%);
    padding: 55px 40px;
    text-align: center;
    background: rgba(8,8,6,.88);
    border: 1px solid #716944;
    box-shadow:
        0 0 80px rgba(0,0,0,.9),
        inset 0 0 50px rgba(255,220,100,.03);
}

h1 {
    margin: 0;
    font-size: clamp(45px, 9vw, 90px);
    letter-spacing: 10px;
    color: #d8cc91;
    text-shadow:
        0 0 10px #d8cc9144,
        0 5px 15px black;
}

.subtitle {
    margin-top: 8px;
    color: #77735c;
    letter-spacing: 5px;
    font-size: 14px;
}

.warning {
    margin: 35px auto;
    max-width: 500px;
    color: #999;
    line-height: 1.7;
    font-size: 14px;
}

button {
    padding: 16px 35px;
    background: #282518;
    border: 1px solid #aaa06b;
    color: #eee;
    font-size: 15px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #49442b;
    box-shadow: 0 0 25px rgba(220,200,100,.15);
}

.controls {
    margin-top: 35px;
    color: #666;
    font-size: 12px;
    line-height: 2;
}
</style>
</head>

<body>

<div class="background"></div>
<div class="noise"></div>

<div class="menu">

    <h1>THE BACKROOMS</h1>

    <div class="subtitle">
        LEVEL 0 — THE HABITATION
    </div>

    <div class="warning">
        You don't remember how you got here.<br>
        The yellow walls stretch forever.<br>
        The lights never stop buzzing.<br><br>

        And you're beginning to hear footsteps.
    </div>

    <button onclick="startGame()">
        ENTER THE BACKROOMS
    </button>

    <div class="controls">
        W A S D — MOVE<br>
        SHIFT — RUN<br>
        MOUSE — LOOK<br>
        E — INTERACT
    </div>

</div>

<script>
function startGame() {
    window.location.href = "game.html";
}
</script>

</body>
</html>
