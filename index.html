<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE BACKROOMS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.background {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
        radial-gradient(circle at center, #655d22 0%, #211f0c 40%, #050505 100%);
}

.background::before {
    content: "";
    position: absolute;
    inset: -100px;
    opacity: .2;
    background-image:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 80px,
            rgba(255,255,255,.08) 81px,
            transparent 82px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 80px,
            rgba(255,255,255,.06) 81px,
            transparent 82px
        );
    transform: perspective(500px) rotateX(10deg);
}

.container {
    position: relative;
    z-index: 2;
    text-align: center;
    width: min(700px, 90%);
}

.warning {
    font-size: 13px;
    letter-spacing: 6px;
    color: #d9d37b;
    margin-bottom: 20px;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-size: clamp(55px, 11vw, 120px);
    letter-spacing: 15px;
    font-weight: 900;
    color: #e9e2a2;
    text-shadow:
        0 0 10px #9f9748,
        0 0 30px rgba(255,230,100,.25);
}

.subtitle {
    margin-top: 10px;
    color: #aaa;
    letter-spacing: 5px;
    font-size: 14px;
}

.buttons {
    margin-top: 55px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
}

button {
    width: 300px;
    max-width: 90%;
    padding: 17px 25px;
    background: rgba(20,20,20,.8);
    border: 1px solid #77734a;
    color: #e9e2a2;
    font-size: 17px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #e8df91;
    color: #111;
    box-shadow: 0 0 25px rgba(255,230,100,.3);
}

.info {
    margin-top: 45px;
    font-size: 11px;
    line-height: 2;
    color: #777;
    letter-spacing: 1px;
}

.version {
    position: absolute;
    bottom: 15px;
    right: 20px;
    color: #444;
    font-size: 10px;
}
</style>
</head>

<body>

<div class="menu">

    <div class="background"></div>

    <div class="container">

        <div class="warning">
            ⚠ DO NOT GET LOST ⚠
        </div>

        <h1>BACKROOMS</h1>

        <div class="subtitle">
            THERE IS NO WAY OUT
        </div>

        <div class="buttons">
            <button onclick="startGame()">ENTER THE BACKROOMS</button>
            <button onclick="showControls()">CONTROLS</button>
        </div>

        <div class="info">
            LEVEL 0 // THE LOBBY<br>
            FIND THE EXIT // AVOID THE ENTITY
        </div>

    </div>

    <div class="version">
        BACKROOMS // v1.0
    </div>

</div>

<script>

function startGame() {
    window.location.href = "game.html";
}

function showControls() {
    alert(
`CONTROLS

W A S D
Move

MOUSE
Look around

SHIFT
Sprint

F
Flashlight

ESC
Release mouse

OBJECTIVE

Explore the Backrooms.
Find the exit.
Don't let the entity find you.`
    );
}

</script>

</body>
</html>
