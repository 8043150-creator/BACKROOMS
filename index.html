```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,Helvetica,sans-serif;
    color:#eee;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.background{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            rgba(177,164,67,.32),
            rgba(0,0,0,.88) 75%
        ),
        #111;
}

.background:after{
    content:"";
    position:absolute;
    inset:0;
    opacity:.16;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 80px,
            rgba(255,255,255,.08) 81px,
            transparent 82px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 80px,
            rgba(255,255,255,.05) 81px,
            transparent 82px
        );
    transform:scale(1.2);
}

.menu{
    position:relative;
    z-index:2;
    width:min(900px,92%);
    text-align:center;
}

.warning{
    font-size:12px;
    letter-spacing:7px;
    color:#aaa05c;
    margin-bottom:20px;
}

.logo{
    font-size:clamp(55px,10vw,115px);
    line-height:.9;
    letter-spacing:15px;
    font-weight:900;
    color:#ddd28b;
    text-shadow:
        0 0 8px rgba(255,239,128,.5),
        0 0 35px rgba(255,235,80,.15);
}

.subtitle{
    margin-top:25px;
    color:#888;
    font-size:13px;
    letter-spacing:6px;
}

.buttons{
    margin-top:55px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

button{
    width:320px;
    max-width:90vw;
    padding:18px;
    background:rgba(10,10,10,.75);
    border:1px solid #77734e;
    color:#d9d18d;
    font-size:15px;
    letter-spacing:4px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#d8d08a;
    color:#111;
    box-shadow:0 0 30px rgba(230,220,110,.25);
}

.warningText{
    margin:55px auto 0;
    max-width:550px;
    color:#555;
    font-size:11px;
    line-height:2;
}

.version{
    position:fixed;
    bottom:15px;
    right:20px;
    color:#333;
    font-size:10px;
}
</style>
</head>

<body>

<div class="background"></div>

<div class="menu">

    <div class="warning">
        ⚠ NO-CLIP DETECTED ⚠
    </div>

    <div class="logo">
        BACKROOMS
    </div>

    <div class="subtitle">
        THERE IS NO WAY OUT
    </div>

    <div class="buttons">

        <button onclick="startGame()">
            ENTER LEVEL 0
        </button>

        <button onclick="controls()">
            CONTROLS
        </button>

    </div>

    <div class="warningText">
        You have entered a place that should not exist.<br>
        The walls repeat. The lights never stop buzzing.<br>
        Something is moving somewhere behind you.
    </div>

</div>

<div class="version">
    BACKROOMS // PRE-ALPHA
</div>

<script>
function startGame(){
    window.location.href="game.html?level=0";
}

function controls(){
    alert(
`CONTROLS

W A S D
Move

MOUSE
Look

SHIFT
Sprint

F
Flashlight

E
Interact / Hide / Open

ESC
Release mouse

OBJECTIVE

Explore the level.
Find keys.
Open doors.
Hide from the Entity.
Find the exit.

WARNING:
The Entity can hear you running.`
    );
}
</script>

</body>
</html>
